version: "3.9"

# Production overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
# Differences from dev: no bind-mounted source (image-baked code), resource limits,
# restart policies always-on, no exposed DB/Redis ports to host, nginx handles TLS termination
# (put a TLS-terminating reverse proxy/load balancer in front of nginx or extend this file with certs).

services:
  mysql:
    ports: []
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    ports: []
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes: [] # no source bind mount in prod - image contains built code
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  whatsapp-gateway:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - gateway_sessions:/app/sessions # keep session persistence volume only
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro

