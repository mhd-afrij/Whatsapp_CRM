version: "3.9"

# Production overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes: []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  whatsapp-gateway:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    volumes:
      - gateway_sessions:/app/sessions
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
