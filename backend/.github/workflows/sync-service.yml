name: WhatsApp Sync Service

on:
  push:
    branches: [main, develop]
    paths:
      - "whatsapp-sync/**"
      - ".github/workflows/sync-service.yml"
  pull_request:
    paths:
      - "whatsapp-sync/**"
      - ".github/workflows/sync-service.yml"

defaults:
  run:
    working-directory: whatsapp-sync

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: whatsapp-sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
