# =============================================================================
# render.yaml - Render Blueprint for CRM WhatsApp (Render Free + Supabase)
# =============================================================================
# Exactly 3 services deployable on Render Free:
#   1. crm-backend      (Docker Web Service: API + Database Queue Worker)
#   2. crm-gateway      (Docker Web Service: WhatsApp Gateway + pg-boss Worker)
#   3. crm-frontend     (Docker Web Service: Next.js Production Frontend)
#
# External Managed Infrastructure:
#   * Database: Supabase PostgreSQL (replaces MySQL)
#   * Queues: PostgreSQL database queues & pg-boss (replaces Redis & BullMQ)
#   * Cache: Laravel PostgreSQL database cache (replaces Redis)
#   * Storage: Supabase Storage whatsapp-media bucket (replaces Azure Blob)
#   * WhatsApp Sessions: Encrypted database persistence (whatsapp_session_credentials)
# =============================================================================

version: "1"

envVarGroups:
  - name: crm-common-env
    envVars:
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: whatsapp-media

services:
  # ---------------------------------------------------------------------------
  # 1. Laravel Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: crm-backend
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    dockerCommand: bash /usr/local/bin/render-entrypoint.sh web
    preDeployCommand: bash /usr/local/bin/render-entrypoint.sh migrate
    buildFilter:
      paths:
        - backend/**
    envVars:
      - fromGroup: crm-common-env
      - key: APP_NAME
        value: "CRM WhatsApp"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: PORT
        value: "10000"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://crm-backend.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: none
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: AWS_BUCKET
        value: whatsapp-media
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: FRONTEND_URL
        value: https://crm-frontend.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: crm-frontend.onrender.com,crm-backend.onrender.com
      - key: WHATSAPP_GATEWAY_URL
        value: https://crm-gateway.onrender.com
      - key: WHATSAPP_GATEWAY_TOKEN
        fromService:
          name: crm-gateway
          type: web
          envVarKey: INTERNAL_GATEWAY_TOKEN
      - key: INTERNAL_SHARED_SECRET
        fromService:
          name: crm-gateway
          type: web
          envVarKey: INTERNAL_SHARED_SECRET
      - key: WHATSAPP_COUNTRY_CODE
        value: "94"
      - key: MAIL_MAILER
        value: log

  # ---------------------------------------------------------------------------
  # 2. WhatsApp Gateway Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: crm-gateway
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./whatsapp-gateway/Dockerfile
    dockerContext: ./whatsapp-gateway
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - whatsapp-gateway/**
    envVars:
      - fromGroup: crm-common-env
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: WHATSAPP_SESSION_DIR
        value: /tmp/whatsapp-sessions
      - key: WHATSAPP_WORKSPACE_ID
        value: "1"
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: whatsapp-media
      - key: LARAVEL_INTERNAL_API_URL
        value: https://crm-backend.onrender.com/api/internal
      - key: SOCKET_CORS_ORIGIN
        value: https://crm-frontend.onrender.com
      - key: INTERNAL_GATEWAY_TOKEN
        generateValue: true
      - key: INTERNAL_SHARED_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 3. Next.js Frontend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: crm-frontend
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_API_URL
        value: https://crm-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://crm-gateway.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://crm-frontend.onrender.com
      - key: NEXT_PUBLIC_WHATSAPP_COUNTRY_CODE
        value: "94"
