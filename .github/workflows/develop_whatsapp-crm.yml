name: Build and deploy WhatsApp Gateway to Azure Web App

on:
  push:
    branches:
      - develop
    paths:
      - "whatsapp-gateway/**"
      - ".github/workflows/deploy-whatsapp-crm.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: whatsapp-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: whatsapp-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production gateway
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p ../azure-package
          cp package.json ../azure-package/
          cp package-lock.json ../azure-package/
          cp -r dist ../azure-package/
          cp -r node_modules ../azure-package/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-gateway
          path: azure-package
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: Production

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: whatsapp-gateway
          path: app

      - name: Deploy WhatsApp Gateway to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "whatsapp-crm"
          slot-name: "Production"
          package: app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FDBEB97F216341E28831DD2C14E20AD3 }}
